apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: aspm-demo
data:
  init.sql: |
    -- Initialize ASPM Demo Database
    -- This script creates the initial database structure and sample data

    -- Create users table
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        email VARCHAR(120) UNIQUE NOT NULL,
        password_hash VARCHAR(255),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Create sensitive data table (demonstrates sensitive data storage)
    CREATE TABLE IF NOT EXISTS sensitive_data (
        id SERIAL PRIMARY KEY,
        user_id INTEGER REFERENCES users(id),
        ssn VARCHAR(11),        -- Social Security Number (sensitive)
        credit_card VARCHAR(16), -- Credit Card Number (sensitive)
        bank_account VARCHAR(20), -- Bank Account Number (sensitive)
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Create audit log table (demonstrates compliance features)
    CREATE TABLE IF NOT EXISTS audit_log (
        id SERIAL PRIMARY KEY,
        table_name VARCHAR(50),
        operation VARCHAR(10),
        user_id INTEGER,
        old_values JSONB,
        new_values JSONB,
        timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        ip_address INET
    );

    -- Insert sample users
    INSERT INTO users (name, email, password_hash) VALUES
        ('Alice Johnson', 'alice@company.com', '$2b$12$LQv3c1yqBWVHxkd0LHAkCOYz6TtxMQJqhN8/LewnaEw8XfKxTR.q2'),
        ('Bob Smith', 'bob@company.com', '$2b$12$LQv3c1yqBWVHxkd0LHAkCOYz6TtxMQJqhN8/LewnaEw8XfKxTR.q2'),
        ('Carol Davis', 'carol@company.com', '$2b$12$LQv3c1yqBWVHxkd0LHAkCOYz6TtxMQJqhN8/LewnaEw8XfKxTR.q2')
    ON CONFLICT (email) DO NOTHING;

    -- Insert sample sensitive data (for ASPM to detect)
    INSERT INTO sensitive_data (user_id, ssn, credit_card, bank_account) VALUES
        (1, '123-45-6789', '4532123456789012', '1234567890123456'),
        (2, '987-65-4321', '5555123456789876', '6543210987654321')
    ON CONFLICT DO NOTHING;

    -- Create indexes for performance
    CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);
    CREATE INDEX IF NOT EXISTS idx_sensitive_data_user_id ON sensitive_data(user_id);
    CREATE INDEX IF NOT EXISTS idx_audit_log_timestamp ON audit_log(timestamp);